name: Format, Lint
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise

      - run: hk run sarif --all --no-fail-fast
      - id: matrix
        if: "!cancelled()"
        run: |
          # shellcheck disable=SC2012
          echo "value=[$(ls .sarif -Qm | sed s/\.sarif//g | tr '\n' ' ')]" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "!cancelled()"
        with:
          name: sarif
          path: .sarif/*
          include-hidden-files: true

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.ref_name == 'master' && !cancelled()
        with:
          commit-message: Linting
          title: Linting (${{ github.ref_name }})
          branch: lint/${{ github.ref_name }}
          delete-branch: true
      - run: git status
        if: github.ref_name != 'master' && !cancelled()

  upload-sarif:
    needs: lint
    runs-on: ubuntu-slim
    if: "!cancelled()"
    strategy:
      matrix:
        value: ${{ fromJSON(needs.lint.outputs.matrix) }}
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif
          path: .sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .sarif/${{ matrix.value }}.sarif
          category: ${{ matrix.value }}
